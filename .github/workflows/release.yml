name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - core
          - flutter
      publish_to_pub_dev:
        description: Publish to pub.dev
        required: true
        type: boolean
        default: false
      draft:
        description: Create a draft GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release core
        if: inputs.package == 'core'
        uses: whilesmart/workflows/flutter/release@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_path: packages/drift_sync_core
          package_type: dart
          tag_prefix: drift_sync_core-v
          publish_to_pub_dev: ${{ inputs.publish_to_pub_dev }}
          draft: ${{ inputs.draft }}

      - name: Release Flutter triggers
        if: inputs.package == 'flutter'
        uses: whilesmart/workflows/flutter/release@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_path: packages/drift_sync_flutter
          package_type: flutter
          tag_prefix: drift_sync_flutter-v
          publish_to_pub_dev: ${{ inputs.publish_to_pub_dev }}
          draft: ${{ inputs.draft }}
